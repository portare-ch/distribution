name: Build

# Two builds of the same device at once corrupt each other's caches. Every
# ccache and build-state asset in distribution-cache is named by device only -
# ccache-aarch64-SM8550.tar, state-aarch64-SM8550-mame-lr.part-aa - with no run
# or branch in the name, so concurrent runs overwrite each other's uploads. The
# retrieve side hides it: an archive downloaded midway through someone else's
# upload fails to extract, and both the ccache retrieve and build-state restore
# swallow that as a cache miss and build cold. The result is a green build that
# silently threw its cache away, which is exactly what a broken cache looks
# like from the outside.
#
# The group is deliberately not scoped to the ref: the shared resource is the
# cache release, which is keyed by device, so a build on another branch
# collides just as badly as a second build on this one. Queue rather than
# cancel - these runs are hours long and the one already going is usually the
# one worth keeping.
concurrency:
  group: build
  cancel-in-progress: false

# No schedule. Upstream builds nightly and monthly, and every job below was
# fenced so those crons only fired for ROCKNIX's own repository. The rename
# turned that fence into a comparison against 'PortareOS/distribution', which
# is not this repository and not anything, so scheduled runs could never have
# started. Rather than repoint the fence and quietly begin a five-hour build
# every night, the crons are gone: builds here are dispatched. Add a cron back
# when a nightly is actually wanted.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Official release'
        required: false
        default: false
        type: boolean
      SM8550:
        description: 'SM8550'
        required: false
        default: false
        type: boolean
      full:
        description: 'Full rebuild: ignore all saved build state and build every package from cold'
        required: false
        default: false
        type: boolean
  workflow_call:
  pull_request:
    types: [ assigned ]

jobs:
  set-envs:
    environment:
      name: ${{ github.event_name == 'pull_request' && 'pr-approval' || 'auto' }}
    runs-on: ubuntu-24.04
    outputs:
      NIGHTLY: ${{ steps.set-release-type.outputs.NIGHTLY }}
      OFFICIAL: ${{ steps.set-release-type.outputs.OFFICIAL }}
      INCREMENTAL: ${{ steps.set-release-type.outputs.INCREMENTAL }}
      BUILD_NEEDED: ${{ steps.build-needed.outputs.NEEDED }}
      OWNER_LC: ${{ steps.set-envs.outputs.OWNER_OUTPUT }}
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          # build-needed.sh diffs against the head of the last green build,
          # which a shallow clone would not contain.
          fetch-depth: 0

      # Costs a couple of seconds and catches a dependency naming a package
      # that is not in the tree. Without it that failure surfaces in
      # genbuildplan.py, after the container pull and well into the build.
      - name: Check package dependencies resolve
        run: python3 .github/scripts/check-package-deps.py

      # A shebang file that is not executable dies with "Permission denied"
      # and exit code 126. scripts/checkdeps is run as a program from
      # config/options, scripts/image, scripts/build_mt and create_addon, so it
      # takes the whole build down after the container is already up. The bit is
      # easy to drop: any edit that rewrites the file through a temp file loses
      # it, and git records the change without it showing in the diff.
      - name: Check shebang scripts are executable
        run: |
          bad=""
          for f in $(git ls-files scripts tools .github/scripts); do
            head -c2 "$f" | grep -q '#!' || continue
            [ "$(git ls-files -s "$f" | cut -d' ' -f1)" = "100755" ] || bad="${bad} ${f}"
          done
          if [ -n "${bad}" ]; then
            echo "::error::not executable, but starts with a shebang:"
            for f in ${bad}; do echo "  ${f}"; done
            echo "Fix with: git update-index --chmod=+x <file>"
            exit 1
          fi
          echo "all shebang scripts under scripts/, tools/ and .github/scripts/ are executable"

      - name: Set lowercase owner name
        id: set-envs
        run: |
          OWNER_LC="${OWNER,,}"
          echo "OWNER_OUTPUT=${OWNER_LC}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}
      - name: Determine release type
        id: set-release-type
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.release }}" == "true" ]]; then
            echo "OFFICIAL=yes" >> $GITHUB_OUTPUT
            echo "NIGHTLY=no" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "0 0 1 * *" ]]; then
            echo "OFFICIAL=yes" >> $GITHUB_OUTPUT
            echo "NIGHTLY=no" >> $GITHUB_OUTPUT
          else
            echo "OFFICIAL=no" >> $GITHUB_OUTPUT
            echo "NIGHTLY=yes" >> $GITHUB_OUTPUT
          fi

          # Incremental is the default now that every stage can restore its own
          # state: a cold build is the deliberate act, not the other way round.
          # Each stage still refuses its saved state whenever the recipes it
          # was built against have moved, so "incremental" never means "stale".
          #
          # A release always builds cold regardless, so nothing we publish can
          # rest on restored state, and ticking "full" forces the same for an
          # ordinary run when you want to rule the cache out of an investigation.
          if [[ "${{ inputs.release }}" == "true" || "${{ inputs.full }}" == "true" ]]; then
            echo "INCREMENTAL=no" >> $GITHUB_OUTPUT
          else
            echo "INCREMENTAL=yes" >> $GITHUB_OUTPUT
          fi
      # Whether anything since the last green build can affect what gets built.
      # Only consulted for automatic triggers: a workflow_dispatch means a
      # person asked for an image and gets one either way.
      - name: Is a build needed
        id: build-needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "NEEDED=yes" >> $GITHUB_OUTPUT
            echo "dispatched by hand - building regardless." >> $GITHUB_STEP_SUMMARY
          else
            NEEDED="$(.github/scripts/build-needed.sh)"
            echo "NEEDED=${NEEDED}" >> $GITHUB_OUTPUT
            if [[ "${NEEDED}" == "no" ]]; then
              echo "No build-affecting change since the last successful build - skipping." >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - id: generate
        shell: bash
        run: |
          declare -A DEVICE_INPUTS=(
            ["SM8550"]="${{ inputs.SM8550 }}"
          )
          
          SELECTED_MATRIX=""
          ALL_DEVICES='[{"device":"SM8550","project":"PortareOS"}]'

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            SCHEDULE_VAR="${{ vars.SCHEDULE_DEVICES }}"
            if [[ -z "$SCHEDULE_VAR" ]]; then
              echo "matrix=$ALL_DEVICES" >> $GITHUB_OUTPUT
              exit 0
            fi
            IFS=',' read -ra DEVICES <<< "$SCHEDULE_VAR"
            for D in "${DEVICES[@]}"; do
              D="${D// /}"
              [[ -z "$D" ]] && continue
              [[ -n "$SELECTED_MATRIX" ]] && SELECTED_MATRIX="$SELECTED_MATRIX,"
              SELECTED_MATRIX="$SELECTED_MATRIX{\"device\":\"$D\",\"project\":\"PortareOS\"}"
            done
          else
            for D in "${!DEVICE_INPUTS[@]}"; do
              VAL="${DEVICE_INPUTS[$D]}"
              if [[ "$VAL" == "true" ]]; then
                [[ -n "$SELECTED_MATRIX" ]] && SELECTED_MATRIX="$SELECTED_MATRIX,"
                SELECTED_MATRIX="$SELECTED_MATRIX{\"device\":\"$D\",\"project\":\"PortareOS\"}"
              fi
            done
          fi
          
          if [[ -z "$SELECTED_MATRIX" ]]; then
            MATRIX="$ALL_DEVICES"
          else
            MATRIX="[$SELECTED_MATRIX]"
          fi
          
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build-docker:
    name: Docker
    needs: set-envs
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-docker-image.yml
    with:
      OWNER_LC: ${{ needs.set-envs.outputs.OWNER_LC }}

  build-devices:
    name: Build Devices
    needs:
      - set-envs
      - build-docker
    if: needs.set-envs.outputs.BUILD_NEEDED != 'no'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.set-envs.outputs.matrix) }}
    permissions:
     contents: read
     actions: write
  
    uses: ./.github/workflows/build-device.yml
    secrets: inherit
    with:
      PROJECT: ${{ matrix.project }}
      DEVICE: ${{ matrix.device }}
      OWNER_LC: ${{ needs.set-envs.outputs.OWNER_LC }}
      NIGHTLY: ${{ needs.set-envs.outputs.NIGHTLY }}
      OFFICIAL: ${{ needs.set-envs.outputs.OFFICIAL }}
      INCREMENTAL: ${{ needs.set-envs.outputs.INCREMENTAL }}

  rerun-failed-jobs:
    if: always() && !cancelled() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && fromJSON(github.run_attempt) < 3 && github.ref_name == 'next'
    needs: build-devices
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run retry-workflow.yml -F run_id=${{ github.run_id }}

  # Publishing a build from a fork.
  #
  # release-nightly and release-official below cannot run here, and the fence
  # on the owner is the least of it: both need secrets this repository does not
  # have (NIGHTLY_APP_ID, NIGHTLY_APP_PRIVATE_KEY, SF_SSH_KEY), both push tags
  # and releases into a companion distribution-nightly repository that does not
  # exist for this owner, and the nightly one rsyncs the images to the PortareOS
  # SourceForge project. Dropping the owner check would just move the failure
  # to the app-token step. So this is a separate job rather than an edit to
  # theirs, which also keeps upstream merges of those two jobs clean.
  #
  # This publishes into this repository's own releases with the default
  # GITHUB_TOKEN. No new secrets, no second repository.
  release-fork:
    if: ${{ always() && !cancelled() && needs.build-devices.result == 'success' && github.event_name != 'pull_request' }}
    name: Release
    needs:
      - set-envs
      - build-devices
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Matches PortareOS-image-SM8550-20260830 and whatever the images are
      # called after the rebranding, without also matching the failure logs,
      # which end in "-image)" rather than "-image-".
      # Must not be "*-image-*". That also matches PortareOS-base-image-*, the
      # intermediate image build-aarch64 uploads before any emulator exists.
      # Both artifacts contain a file called PortareOS-<device>.<arch>-<date>.img.gz,
      # and merge-multiple flattens them onto the same path, so one lands on top
      # of the other and the .sha256 published alongside belongs to whichever
      # lost. That is how nightly-20260904-31 shipped an .img.gz that gunzip
      # refuses within the first megabyte.
      - name: Download images
        uses: actions/download-artifact@v8
        with:
          pattern: "PortareOS-image-*"
          merge-multiple: true

      - name: Download update packages
        uses: actions/download-artifact@v8
        with:
          pattern: "*-update-*"
          merge-multiple: true

      - name: Work out the tag
        id: tag
        run: |
          DATE="$(date +'%Y%m%d')"
          # The run number keeps a second build on the same day from colliding
          # with the first, which gh release create treats as a hard error.
          if [ "${{ needs.set-envs.outputs.OFFICIAL }}" = "yes" ]; then
            echo "tag=release-${DATE}-${{ github.run_number }}" >> "${GITHUB_OUTPUT}"
            echo "prerelease=" >> "${GITHUB_OUTPUT}"
          else
            echo "tag=nightly-${DATE}-${{ github.run_number }}" >> "${GITHUB_OUTPUT}"
            echo "prerelease=--prerelease" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          # Collect by extension rather than by name prefix, so this keeps
          # working when the images stop being called PortareOS-*.
          mapfile -t FILES < <(find . -type f \
            \( -name '*.img.gz' -o -name '*.tar' -o -name '*.sha256' \) | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No image or update files were downloaded - nothing to publish." >&2
            exit 1
          fi
          printf 'publishing %s\n' "${FILES[@]}"

          # Two files with one name means an artifact pattern collided and the
          # winner is whichever was written last. Refuse rather than publish it.
          if [ "$(printf '%s\n' "${FILES[@]}" | xargs -n1 basename | sort | uniq -d)" ]; then
            echo "Duplicate basenames among the downloaded files:" >&2
            printf '%s\n' "${FILES[@]}" | xargs -n1 basename | sort | uniq -d >&2
            exit 1
          fi

          # Check every image against the checksum published beside it. The
          # build wrote both, so a mismatch here means they stopped being the
          # same file somewhere between the build and this runner. Cheap, and
          # it is the check that would have caught nightly-20260904-31 before
          # anyone downloaded 1.5 GB of it.
          for sum in *.sha256; do
            [ -e "${sum}" ] || continue
            if ! sha256sum -c "${sum}"; then
              echo "${sum} does not match the file beside it - refusing to publish." >&2
              exit 1
            fi
          done

          {
            echo "Built from \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\`."
            echo
            echo "A personal fork for the Retroid Pocket Nova (SM8550)."
            echo "Write the .img.gz to a microSD card. See https://os.portare.org"
            echo "for installation steps."
          } > release-notes.md

          gh release create "${TAG}" "${FILES[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --notes-file release-notes.md \
            ${PRERELEASE}
