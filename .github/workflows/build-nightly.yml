name: Build

# Two builds of the same device at once corrupt each other's caches. Every
# ccache and build-state asset in distribution-cache is named by device only -
# ccache-aarch64-SM8550.tar, state-aarch64-SM8550-mame-lr.part-aa - with no run
# or branch in the name, so concurrent runs overwrite each other's uploads. The
# retrieve side hides it: an archive downloaded midway through someone else's
# upload fails to extract, and both the ccache retrieve and build-state restore
# swallow that as a cache miss and build cold. The result is a green build that
# silently threw its cache away, which is exactly what a broken cache looks
# like from the outside.
#
# The group is deliberately not scoped to the ref: the shared resource is the
# cache release, which is keyed by device, so a build on another branch
# collides just as badly as a second build on this one. Queue rather than
# cancel - these runs are hours long and the one already going is usually the
# one worth keeping.
concurrency:
  group: build
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 0 2-31 * *"
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      release:
        description: 'Official release'
        required: false
        default: false
        type: boolean
      SM8550:
        description: 'SM8550'
        required: false
        default: false
        type: boolean
      incremental:
        description: 'Only rebuild what changed (skips mame/libretro/standalone when their recipes are untouched)'
        required: false
        default: false
        type: boolean
  workflow_call:
  pull_request:
    types: [ assigned ]

jobs:
  set-envs:
    if: (github.event_name != 'schedule') || (github.repository == 'ROCKNIX/distribution' && github.ref_name == 'next')
    environment:
      name: ${{ github.event_name == 'pull_request' && 'pr-approval' || 'auto' }}
    runs-on: ubuntu-24.04
    outputs:
      NIGHTLY: ${{ steps.set-release-type.outputs.NIGHTLY }}
      OFFICIAL: ${{ steps.set-release-type.outputs.OFFICIAL }}
      INCREMENTAL: ${{ steps.set-release-type.outputs.INCREMENTAL }}
      OWNER_LC: ${{ steps.set-envs.outputs.OWNER_OUTPUT }}
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Set lowercase owner name
        id: set-envs
        run: |
          OWNER_LC="${OWNER,,}"
          echo "OWNER_OUTPUT=${OWNER_LC}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}
      - name: Determine release type
        id: set-release-type
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.release }}" == "true" ]]; then
            echo "OFFICIAL=yes" >> $GITHUB_OUTPUT
            echo "NIGHTLY=no" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "0 0 1 * *" ]]; then
            echo "OFFICIAL=yes" >> $GITHUB_OUTPUT
            echo "NIGHTLY=no" >> $GITHUB_OUTPUT
          else
            echo "OFFICIAL=no" >> $GITHUB_OUTPUT
            echo "NIGHTLY=yes" >> $GITHUB_OUTPUT
          fi

          # Incremental is opt-in, and only ever on a manual run. A scheduled
          # nightly and anything marked as a release always build cold, so
          # stale state can never accumulate into something we publish.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" \
             && "${{ inputs.incremental }}" == "true" \
             && "${{ inputs.release }}" != "true" ]]; then
            echo "INCREMENTAL=yes" >> $GITHUB_OUTPUT
          else
            echo "INCREMENTAL=no" >> $GITHUB_OUTPUT
          fi
      - id: generate
        shell: bash
        run: |
          declare -A DEVICE_INPUTS=(
            ["SM8550"]="${{ inputs.SM8550 }}"
          )
          
          SELECTED_MATRIX=""
          ALL_DEVICES='[{"device":"SM8550","project":"ROCKNIX"}]'

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            SCHEDULE_VAR="${{ vars.SCHEDULE_DEVICES }}"
            if [[ -z "$SCHEDULE_VAR" ]]; then
              echo "matrix=$ALL_DEVICES" >> $GITHUB_OUTPUT
              exit 0
            fi
            IFS=',' read -ra DEVICES <<< "$SCHEDULE_VAR"
            for D in "${DEVICES[@]}"; do
              D="${D// /}"
              [[ -z "$D" ]] && continue
              [[ -n "$SELECTED_MATRIX" ]] && SELECTED_MATRIX="$SELECTED_MATRIX,"
              SELECTED_MATRIX="$SELECTED_MATRIX{\"device\":\"$D\",\"project\":\"ROCKNIX\"}"
            done
          else
            for D in "${!DEVICE_INPUTS[@]}"; do
              VAL="${DEVICE_INPUTS[$D]}"
              if [[ "$VAL" == "true" ]]; then
                [[ -n "$SELECTED_MATRIX" ]] && SELECTED_MATRIX="$SELECTED_MATRIX,"
                SELECTED_MATRIX="$SELECTED_MATRIX{\"device\":\"$D\",\"project\":\"ROCKNIX\"}"
              fi
            done
          fi
          
          if [[ -z "$SELECTED_MATRIX" ]]; then
            MATRIX="$ALL_DEVICES"
          else
            MATRIX="[$SELECTED_MATRIX]"
          fi
          
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build-docker:
    if: github.event_name != 'schedule' || (github.repository == 'ROCKNIX/distribution' && github.ref_name == 'next')
    name: Docker
    needs: set-envs
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-docker-image.yml
    with:
      OWNER_LC: ${{ needs.set-envs.outputs.OWNER_LC }}

  build-devices:
    if: (github.event_name != 'schedule') || (github.repository == 'ROCKNIX/distribution' && github.ref_name == 'next')
    name: Build Devices
    needs:
      - set-envs
      - build-docker
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.set-envs.outputs.matrix) }}
    permissions:
     contents: read
     actions: write
  
    uses: ./.github/workflows/build-device.yml
    secrets: inherit
    with:
      PROJECT: ${{ matrix.project }}
      DEVICE: ${{ matrix.device }}
      OWNER_LC: ${{ needs.set-envs.outputs.OWNER_LC }}
      NIGHTLY: ${{ needs.set-envs.outputs.NIGHTLY }}
      OFFICIAL: ${{ needs.set-envs.outputs.OFFICIAL }}
      INCREMENTAL: ${{ needs.set-envs.outputs.INCREMENTAL }}

  rerun-failed-jobs:
    if: always() && !cancelled() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && fromJSON(github.run_attempt) < 3 && github.ref_name == 'next' && (github.event_name != 'schedule' || github.repository == 'ROCKNIX/distribution')
    needs: build-devices
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run retry-workflow.yml -F run_id=${{ github.run_id }}

  # Publishing a build from a fork.
  #
  # release-nightly and release-official below cannot run here, and the fence
  # on the owner is the least of it: both need secrets this repository does not
  # have (NIGHTLY_APP_ID, NIGHTLY_APP_PRIVATE_KEY, SF_SSH_KEY), both push tags
  # and releases into a companion distribution-nightly repository that does not
  # exist for this owner, and the nightly one rsyncs the images to the ROCKNIX
  # SourceForge project. Dropping the owner check would just move the failure
  # to the app-token step. So this is a separate job rather than an edit to
  # theirs, which also keeps upstream merges of those two jobs clean.
  #
  # This publishes into this repository's own releases with the default
  # GITHUB_TOKEN. No new secrets, no second repository.
  release-fork:
    if: ${{ always() && !cancelled() && needs.build-devices.result == 'success' && github.repository_owner != 'ROCKNIX' && github.event_name != 'pull_request' }}
    name: Release
    needs:
      - set-envs
      - build-devices
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Matches PortareOS-image-SM8550-20260830 and whatever the images are
      # called after the rebranding, without also matching the failure logs,
      # which end in "-image)" rather than "-image-".
      - name: Download images
        uses: actions/download-artifact@v8
        with:
          pattern: "*-image-*"
          merge-multiple: true

      - name: Download update packages
        uses: actions/download-artifact@v8
        with:
          pattern: "*-update-*"
          merge-multiple: true

      - name: Work out the tag
        id: tag
        run: |
          DATE="$(date +'%Y%m%d')"
          # The run number keeps a second build on the same day from colliding
          # with the first, which gh release create treats as a hard error.
          if [ "${{ needs.set-envs.outputs.OFFICIAL }}" = "yes" ]; then
            echo "tag=release-${DATE}-${{ github.run_number }}" >> "${GITHUB_OUTPUT}"
            echo "prerelease=" >> "${GITHUB_OUTPUT}"
          else
            echo "tag=nightly-${DATE}-${{ github.run_number }}" >> "${GITHUB_OUTPUT}"
            echo "prerelease=--prerelease" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          # Collect by extension rather than by name prefix, so this keeps
          # working when the images stop being called ROCKNIX-*.
          mapfile -t FILES < <(find . -type f \
            \( -name '*.img.gz' -o -name '*.tar' -o -name '*.sha256' \) | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No image or update files were downloaded - nothing to publish." >&2
            exit 1
          fi
          printf 'publishing %s\n' "${FILES[@]}"

          {
            echo "Built from \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\`."
            echo
            echo "A personal fork of ROCKNIX for the Retroid Pocket Nova (SM8550)."
            echo "Write the .img.gz to a microSD card. See https://os.portare.org"
            echo "for installation steps."
          } > release-notes.md

          gh release create "${TAG}" "${FILES[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --notes-file release-notes.md \
            ${PRERELEASE}

  release-nightly:
     if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.repository_owner == 'ROCKNIX' && needs.set-envs.outputs.NIGHTLY == 'yes' && github.event_name != 'pull_request' }}
     name: Release nightly
     needs: build-devices
     runs-on: ubuntu-24.04
     steps:
     - name: debug needs
       run: echo '${{ toJSON(needs) }}'
     - name: Maximize build space
       uses: justinthelaw/maximize-github-runner-space@v0.9.0
       with:
         skip-components: docker-engine,gh-cli
     - uses: actions/checkout@v6
       with:
         fetch-depth: 0
         persist-credentials: false
     - name: Download artifacts
       uses: actions/download-artifact@v8
       with:
         pattern: PortareOS-image*
         merge-multiple: true
     - name: Download artifacts
       uses: actions/download-artifact@v8
       with:
         pattern: PortareOS-update*
         merge-multiple: true
     - name: get date
       run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
     - name: Generate installation token for GitHub App
       id: app-token
       uses: actions/create-github-app-token@v2
       with:
         app-id: ${{ secrets.NIGHTLY_APP_ID }}
         private-key: ${{ secrets.NIGHTLY_APP_PRIVATE_KEY }}
         owner: ${{ github.repository_owner }}
     - name: create nightlies tag
       id: create-nightly-tag
       run: |
         git remote add distribution-nightly https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository_owner }}/distribution-nightly.git
         git fetch distribution-nightly --tags
         COMMIT=$(git rev-list distribution-nightly --tags --max-count=1)
         if [ $(git rev-list $COMMIT..HEAD --count) -eq 0 ]; then
           echo "new_commits=false" >> $GITHUB_ENV
         else
           {
             printf "Changelog since last nightly:\n"
             bash .github/scripts/generate-changelog.sh "$COMMIT..$GITHUB_SHA" 100
             printf "\n\nAlternative download site: https://sourceforge.net/projects/rocknix/files/nightly/%s/\n" "$(date +%Y%m%d)"
           } > release-notes.md
           git tag -f nightly-${{ env.DATE }}
           git push -f distribution-nightly nightly-${{ env.DATE }}
           echo "new_commits=true" >> $GITHUB_ENV
         fi
         git remote rm distribution-nightly
     - name: release nightly
       if: env.new_commits == 'true'
       env:
         GH_TOKEN: ${{ steps.app-token.outputs.token }}
       run: |
         gh release create "nightly-${{ env.DATE }}" ROCKNIX-* \
           --repo "${{ github.repository_owner }}/distribution-nightly" \
           --title "nightly-${{ env.DATE }}" \
           --notes-file release-notes.md \
           --prerelease
     - name: Set up SSH sourceforge
       if: env.new_commits == 'true'
       run: |
         mkdir -p ~/.ssh
         echo "${{ secrets.SF_SSH_KEY }}" > ~/.ssh/id_ed25519
         chmod 600 ~/.ssh/id_ed25519
         ssh-keyscan frs.sourceforge.net >> ~/.ssh/known_hosts
     - name: Upload files sourceforge
       if: env.new_commits == 'true'
       run: |
         FILES=$(find . -type f \( -name "*.tar" -o -name "*.img.gz" -o -name "*.sha256" \))
         for FILE in $FILES; do
           rsync -e ssh "$FILE" tiopex@frs.sourceforge.net:/home/frs/project/rocknix/nightly/${{ env.DATE }}/
         done

  release-official:
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.repository_owner == 'ROCKNIX' && needs.set-envs.outputs.OFFICIAL == 'yes' }}
    name: Release official
    needs: build-devices
    runs-on: ubuntu-24.04
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine,gh-cli
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: PortareOS-image*
          merge-multiple: true
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: PortareOS-update*
          merge-multiple: true
      - name: get date
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
      - name: get last tag
        id: get-last-tag
        run: |
          echo "TAG=$(git tag --sort=-creatordate | head -n 1)" >> $GITHUB_OUTPUT
      - name: Generate installation token for GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.NIGHTLY_APP_ID }}
          private-key: ${{ secrets.NIGHTLY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Install xmlstarlet
        run: sudo apt-get install -y xmlstarlet
      - name: Generate release body
        run: |
          bash .github/scripts/generate-release-body.sh "${{ env.DATE }}" "${{ steps.get-last-tag.outputs.TAG }}" > release-body.md
      - name: release official
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create "${{ env.DATE }}" ROCKNIX-* \
            --target "${{ github.sha }}" \
            --title "${{ env.DATE }}" \
            --notes-file release-body.md \
            --latest

