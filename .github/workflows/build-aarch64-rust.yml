name: Build aarch64 rust

on:
  workflow_call:
    inputs:
      PROJECT:
        required: true
        type: string
      DEVICE:
        required: true
        type: string
      OWNER_LC:
        required: true
        type: string
      INCREMENTAL:
        description: "yes to restore this stage's saved state and rebuild only what changed"
        required: false
        default: "no"
        type: string

jobs:
  build-aarch64-rust:
    timeout-minutes: 180
    runs-on: ubuntu-24.04
    env:
      AUTOREMOVE: "yes"
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      ARCH: aarch64
      DISABLE_COLORS: yes
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download aarch64-toolchain (${{ inputs.DEVICE }})
        uses: actions/download-artifact@v8
        with:
          name: aarch64-toolchain (${{ inputs.DEVICE }})

      - name: Extract artifact aarch64-toolchain
        run: |
          tar --zstd -xf build.aarch64-toolchain.tar.zst

      - name: Clean up compressed aarch64-toolchain file
        run: rm build.aarch64-toolchain.tar.zst

      # Record what the upstream stage artifacts just delivered: a digest of
      # their stamps (the dependency recipes this stage is about to build
      # against) and the list of packages they installed. Both are needed
      # whether or not we restore, because the save step below uses them.
      - name: Snapshot the upstream build state
        id: upstream
        run: |
          echo "digest=$(.github/scripts/build-state.sh snapshot \
            build.PortareOS-${{ inputs.DEVICE }}.aarch64)" >> "${GITHUB_OUTPUT}"

      # Restoring .stamps and install_pkg lets scripts/build skip every package
      # whose recipe is unchanged. Skipped when the digest above differs from
      # the one the archive was saved against, and skipped entirely on a run
      # that asked for a full rebuild.
      - name: Restore saved build state
        if: inputs.INCREMENTAL == 'yes'
        env:
          CACHE_REPO: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        run: |
          .github/scripts/build-state.sh restore \
            build.PortareOS-${{ inputs.DEVICE }}.aarch64 \
            state-aarch64-${{ inputs.DEVICE }}-rust \
            "${{ steps.upstream.outputs.digest }}"

      - name: Build cargo:host
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            ./scripts/get_env > .env
            set -e
            { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/portareos-build:latest" \
              bash -c "./scripts/build_mt cargo:host"; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
            exit_code=$(<docker_exit_code)
            exit $exit_code
          max_attempts: 6
          retry_interval: 10

      - name: Archive output.logs (${{ inputs.DEVICE }}-aarch64-rust)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs-${{ inputs.DEVICE }}-aarch64-rust
          path: |
            output.log
            ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/.threads/logs/


      # Save this stage's own packages and stamps for the next incremental run,
      # tagged with the upstream digest they were built against. Saved on every
      # run, including full ones, so a full rebuild refreshes the state rather
      # than leaving a stale archive behind.
      - name: Save build state
        run: |
          .github/scripts/build-state.sh save \
            build.PortareOS-${{ inputs.DEVICE }}.aarch64 \
            state-aarch64-${{ inputs.DEVICE }}-rust \
            "${{ steps.upstream.outputs.digest }}"

      - name: Upload build state
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ccache
          files: "state-aarch64-${{ inputs.DEVICE }}-rust.part-*"
          make_latest: true
          prerelease: true
          body: ccache
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true

      - name: Drop the state archive before packing the artifact
        run: rm -f state-aarch64-${{ inputs.DEVICE }}-rust.part-*

      - name: Print space
        run: df -h

      - name: Compress directory
        run: |
          tar --zstd --remove-files \
          -cf build.aarch64-rust.tar.zst ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/

      - uses: actions/upload-artifact@v7
        with:
          name: aarch64-rust (${{ inputs.DEVICE }})
          path: build.aarch64-rust.tar.zst
          compression-level: 0
          if-no-files-found: error

