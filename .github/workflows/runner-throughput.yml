name: Runner throughput

# Can the build actually move to arm64 runners?
#
# The throughput question this workflow started life asking is answered. On
# identical 4-core/15GiB runners, arm64 (Neoverse-V2) compiled ffmpeg in 173s
# against x86_64's 228s, and abseil in 30s against 42s - about 30% less wall
# clock, with the better of the two figures being the C++ one, which is the
# kind of work our critical path is made of.
#
# amd64 was never a requirement, only the default runner: nothing we ship is
# amd64, and the one place a prebuilt host binary is fetched - the three rust
# snapshots - already has pinned aarch64 checksums upstream, verified against
# static.rust-lang.org for our pinned 1.97.1. So this is not a port to a
# second architecture, it is a move to a different single one.
#
# What is still unknown is mechanical, and none of it is answered by a
# compile benchmark:
#
#   1. maximize-github-runner-space. Every build stage runs it first. It
#      deletes preinstalled toolsets by path and the arm64 runner image ships
#      a different set, so it may fail outright or free far less. A stage
#      that runs out of disk four hours in is the expensive way to find out.
#   2. The build container. Dockerfile already has an aarch64 branch
#      (libc6-amd64-cross, qemu-user-binfmt) inherited from upstream, but it
#      has never been built for arm64 here - the workflow passes no platforms,
#      so :latest is an amd64-only manifest. Pulling that on an arm64 runner
#      does not fail loudly; it runs every compile under emulation.
#   3. Whether gcc-12 and the rest of that package set resolve on arm64 noble
#      at all, and whether checkdeps is satisfied inside the result.
#
# All three are cheap to answer in one job, and expensive to discover inside
# a five-hour build.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Disk before
        run: df -h / /mnt 2>/dev/null || df -h /

      # Not allowed to take the job down. Finding out that it fails here is
      # the point, and everything after it still needs to run.
      - name: Maximize build space
        id: maximize
        continue-on-error: true
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine

      - name: Disk after
        run: |
          echo "maximize outcome: ${{ steps.maximize.outcome }}"
          df -h / /mnt 2>/dev/null || df -h /

      - name: Build the container natively for arm64
        run: |
          start=$(date +%s)
          docker build -t portareos-build:probe -f Dockerfile . 2>&1 | tail -30
          echo "::notice title=container::built in $(( $(date +%s) - start ))s"

      - name: Does it work
        run: |
          docker run --rm portareos-build:probe bash -c '
            echo "uname:       $(uname -m)"
            echo "gcc:         $(gcc --version | head -1)"
            echo "g++:         $(g++ --version | head -1)"
            echo "go:          $(go version)"
            echo "multiarch:   $(gcc -print-multiarch)"
            echo "qemu-x86_64: $(command -v qemu-x86_64 || echo absent)"
          '

      # scripts/checkdeps is what every build stage runs before anything else,
      # and it is the file that carries the native-aarch64 host special cases.
      # If the container satisfies it, the stages have what they need.
      - name: Would checkdeps pass inside it
        run: |
          docker run --rm -v "${PWD}:${PWD}" -w "${PWD}" -u "$(id -u):$(id -g)" \
            -e PROJECT=PortareOS -e DEVICE=SM8550 -e ARCH=aarch64 \
            portareos-build:probe ./scripts/checkdeps \
            && echo "::notice title=checkdeps::ok" \
            || echo "::warning title=checkdeps::failed - see output above"
