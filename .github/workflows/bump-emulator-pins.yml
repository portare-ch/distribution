name: Bump emulator pins

# Keeps RetroArch, the libretro cores and the commit-pinned standalone
# emulators moving with their upstreams, as one rolling pull request.
#
# 06:00 UTC deliberately: the nightly build runs at 23:00 and the monthly
# release at 00:00 on the 1st, so this never competes with either for the
# build concurrency group - and it does not need to, because it builds
# nothing. A pull request only starts a build once somebody assigns it
# (build-nightly.yml triggers on pull_request types: [assigned]), so this
# can run every morning without ever costing five hours of runner time.
#
# The branch name is fixed rather than dated, so each run updates the same
# pull request instead of opening a new one. Merge it and the next morning
# brings the next set; leave it and it keeps refreshing until you do.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    name: Move pins to upstream HEAD
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Move the pins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./tools/bump-emulator-pins --report bump-report.md

      # The report is the pull request body, so it must not also be part of
      # the diff being proposed.
      - name: Stage the report out of the tree
        run: |
          mv bump-report.md "${RUNNER_TEMP}/bump-report.md"
          {
            echo "Opened by \`tools/bump-emulator-pins\`, which reads each"
            echo "package's upstream default branch, downloads the tarball the"
            echo "new commit produces, and hashes it here. No checksum in this"
            echo "diff was copied from anywhere."
            echo
            cat "${RUNNER_TEMP}/bump-report.md"
            echo
            echo "Nothing here has been built. Assign this pull request to"
            echo "start a build, or merge it and let the nightly pick it up."
          } > "${RUNNER_TEMP}/pr-body.md"

      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bump/emulator-pins
          delete-branch: true
          commit-message: "emulators: move commit pins to upstream HEAD"
          title: "emulators: move commit pins to upstream HEAD"
          body-path: ${{ runner.temp }}/pr-body.md
