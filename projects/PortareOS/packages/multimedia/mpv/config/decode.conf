# Which decoder plays a film. Included by start_mpv.sh.
#
# Software below 720p, the iris hardware decoder from 720p up.
#
# The hardware decoder saves real power where it matters: 1080p H.264 costs
# 78% of a core in software and 17% in hardware, measured on the device.
# Standard definition is cheap either way - a 712x478 DVD rip is 16% in
# software - and the hardware path has been seen to fail there: one such rip
# (H.264 High@4.1) decoded to solid green through v4l2m2m while the audio
# played on. A failure like that is silent, so mpv cannot fall back from it.
# Test patterns at the same size and at every common SD size decoded fine,
# so this is a property of some encodes, not of the resolution; keeping SD
# on the CPU avoids the class for a cost of a few percent.
#
# The profile applies once the width is known, and switching hwdec then
# reinitialises the decoder once at the start of an HD file.
hwdec=no

[hd-hardware-decode]
profile-cond=get("width", 0) >= 1280
profile-restore=copy-equal
hwdec=v4l2m2m-copy
