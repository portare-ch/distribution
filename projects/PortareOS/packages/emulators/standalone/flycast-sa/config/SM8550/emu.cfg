[audio]
backend = sdl2

[config]
pvr.AutoSkipFrame = 2
pvr.rend = 0
rend.Resolution = 480
rend.ShowFPS = no
rend.SuperWideScreen = no
rend.WideScreen = no
rend.vsync = no

[input]
maple_sdl_joystick_0 = 0
maple_sdl_joystick_1 = 1

device1 = 0
device1.1 = 1
device1.2 = 1
device2 = 0
device2.1 = 1
device2.2 = 1

[window]
fullscreen = yes
height = 960
width = 1280
