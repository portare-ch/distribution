# Snes9x hands RetroArch 32040 Hz, the rate of a real SNES's DSP (32000
# nominal). At the global audio_out_rate of 48000, RetroArch upsampled it by
# half again. The Nova's link runs at 32000 (kernel patch 1055), so asking
# for it leaves only a 0.125% conversion from 32040, well inside what
# rate control adjusts anyway to keep audio in step with the display.
audio_out_rate = "32000"
