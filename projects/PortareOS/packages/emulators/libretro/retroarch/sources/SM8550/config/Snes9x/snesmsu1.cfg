# Content-directory override for games in snesmsu1. With
# snes9x_msu1_enhanced_audio at its default, Snes9x hands RetroArch 44100 Hz
# for MSU-1 games, their CD-quality soundtrack. The core-wide 32000 in
# Snes9x.cfg would cut it, so this folder keeps 44100, which the link also
# carries without conversion.
audio_out_rate = "44100"
