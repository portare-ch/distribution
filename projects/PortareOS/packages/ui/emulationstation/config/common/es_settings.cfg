<?xml version="1.0"?>
<config>
    <!-- The main loop in es-app/src/main.cpp calls window.render() and
         Renderer::swapBuffers() every iteration with no damage tracking, so
         with no limit the frontend draws at whatever the compositor allows.
         A menu does not need 120, and halving the draws halves the GPU work.

         It does not let the GPU rail power down: Adreno's autosuspend delay
         is 66ms and 60fps touches the GPU every 16.7ms, so gpu_cc_gx_gdsc
         stays on either way. That needs ES to stop rendering, which is what
         power-handler's freeze on blank does. Emulators are separate
         processes and are not capped by this. -->
    <int name="FpsLimit" value="60" />
</config>
