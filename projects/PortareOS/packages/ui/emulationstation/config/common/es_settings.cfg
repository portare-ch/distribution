<?xml version="1.0"?>
<config>
    <!-- The main loop in es-app/src/main.cpp calls window.render() and
         Renderer::swapBuffers() every iteration with no damage tracking, so
         with no limit the frontend draws at whatever the compositor allows.
         On this 120Hz panel that means the Adreno core rail never gets its
         66ms of idle and gpu_cc_gx_gdsc stays powered for as long as the menu
         is up, which is measurable in pm_genpd_summary. 60 halves the work
         and leaves the carousel smooth; emulators are separate processes and
         are not capped by this. -->
    <int name="FpsLimit" value="60" />
</config>
