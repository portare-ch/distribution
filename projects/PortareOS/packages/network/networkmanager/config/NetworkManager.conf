# PortareOS: NetworkManager owns Ethernet and Wi-Fi; Wi-Fi uses iwd as backend.

[main]
auth-polkit=false
plugins=keyfile
dhcp=internal
dns=systemd-resolved

[device]
wifi.backend=iwd

[keyfile]
path=/storage/.config/NetworkManager/system-connections
# PortareOS USB gadget not DHCP to a router.
unmanaged-devices=interface-name:gadget;interface-name:usb0;interface-name:usbnet;interface-name:rndis0

# PortareOS: keep trying the saved networks. The default gives up on a
# profile after four failed attempts, and at boot the first attempts are
# made while the radio's firmware is still loading after the rfkill unblock,
# so a network that needs a hand every boot is what four attempts buy.
# 0 is "forever"; NetworkManager backs off between tries on its own.
[connection]
connection.autoconnect-retries=0
